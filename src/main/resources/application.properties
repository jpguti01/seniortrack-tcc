# 1. Configuracao do banco de dados PostgreSQL.
# Os valores default abaixo (depois do ":") sao so para desenvolvimento local;
# em qualquer outro ambiente, defina as variaveis de ambiente DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/telemonitoramento_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# 2. Faz o Hibernate criar/atualizar as tabelas automaticamente (apropriado so para desenvolvimento)
spring.jpa.hibernate.ddl-auto=update

# 3. Mostra os comandos SQL formatados no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. Caminho do arquivo de credenciais do Firebase (notificacoes push via FCM).
# Deixe em branco para desativar as notificacoes push.
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# 5. Autenticacao JWT (RNF05). Em producao, defina JWT_SECRET com um valor
# forte e secreto via variavel de ambiente - nunca reaproveite o default abaixo.
jwt.secret=${JWT_SECRET:troque-este-valor-em-producao-use-uma-chave-aleatoria-longa}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# 6. Canais externos para urgencias (alerta critico ou persistente, SOS, remedio
# nao confirmado). Todos desativados enquanto as variaveis estiverem vazias.
# Twilio: SMS e/ou WhatsApp (o remetente do WhatsApp e' o numero aprovado na Twilio).
notificacao.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
notificacao.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
notificacao.twilio.from-sms=${TWILIO_FROM_SMS:}
notificacao.twilio.from-whatsapp=${TWILIO_FROM_WHATSAPP:}
# Webhook generico (n8n, Make, Zapier...): recebe um POST em JSON por urgencia.
notificacao.webhook.url=${NOTIFICACAO_WEBHOOK_URL:}
notificacao.webhook.token=${NOTIFICACAO_WEBHOOK_TOKEN:}

# Opções de acesso: ausentes = desabilitadas, sem simular envio ou autenticação.
auth.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
auth.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
auth.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
auth.google.client-id=${GOOGLE_CLIENT_ID:}
